name: smart-task-manager

x-dotnet-common: &dotnet-common
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080
    SEQ_URL: http://seq:5341
    JWT_SECRET: ${JWT_SECRET:-please-change-this-32-byte-minimum-secret-value}
  depends_on:
    seq:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    container_name: tm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: identity_db,tasks_db,analytics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tm-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: tm-seq
    environment:
      ACCEPT_EULA: "Y"
      # recent Seq images refuse to start without an admin password or explicit no-auth
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  mailhog:
    image: mailhog/mailhog
    container_name: tm-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  gateway:
    <<: *dotnet-common
    container_name: tm-gateway
    build:
      context: .
      dockerfile: src/gateway/TaskManager.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SEQ_URL: http://seq:5341
      JWT_SECRET: ${JWT_SECRET:-please-change-this-32-byte-minimum-secret-value}
    ports:
      - "5000:8080"
    depends_on:
      seq:
        condition: service_started
    healthcheck:
      # aspnet runtime images ship no wget/curl — probe /health with bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-svc:
    <<: *dotnet-common
    container_name: tm-identity
    build:
      context: .
      dockerfile: src/services/identity/TaskManager.Identity/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SEQ_URL: http://seq:5341
      JWT_SECRET: ${JWT_SECRET:-please-change-this-32-byte-minimum-secret-value}
      IDENTITY_DB_CONNECTION: Host=postgres;Database=identity_db;Username=postgres;Password=postgres
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      # aspnet runtime images ship no wget/curl — probe /health with bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  tasks-svc:
    <<: *dotnet-common
    container_name: tm-tasks
    build:
      context: .
      dockerfile: src/services/tasks/TaskManager.Tasks/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SEQ_URL: http://seq:5341
      JWT_SECRET: ${JWT_SECRET:-please-change-this-32-byte-minimum-secret-value}
      TASKS_DB_CONNECTION: Host=postgres;Database=tasks_db;Username=postgres;Password=postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      # aspnet runtime images ship no wget/curl — probe /health with bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  notifications-svc:
    <<: *dotnet-common
    container_name: tm-notifications
    build:
      context: .
      dockerfile: src/services/notifications/TaskManager.Notifications/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SEQ_URL: http://seq:5341
      JWT_SECRET: ${JWT_SECRET:-please-change-this-32-byte-minimum-secret-value}
      REDIS_URL: redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      IDENTITY_URL: http://identity-svc:8080
    ports:
      - "5003:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
      seq:
        condition: service_started
    healthcheck:
      # aspnet runtime images ship no wget/curl — probe /health with bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5

  analytics-svc:
    <<: *dotnet-common
    container_name: tm-analytics
    build:
      context: .
      dockerfile: src/services/analytics/TaskManager.Analytics/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      SEQ_URL: http://seq:5341
      JWT_SECRET: ${JWT_SECRET:-please-change-this-32-byte-minimum-secret-value}
      ANALYTICS_DB_CONNECTION: Host=postgres;Database=analytics_db;Username=postgres;Password=postgres
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      # aspnet runtime images ship no wget/curl — probe /health with bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  seq-data:
