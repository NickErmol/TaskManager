name: E2E

# Playwright end-to-end suite. Heavyweight: it builds all five service images,
# brings up the full docker compose stack (postgres/redis/rabbitmq/seq/mailhog),
# runs the Angular dev server, and drives Chromium. Too slow/expensive for every
# feature push, so it gates only the integration points (PRs into develop/main)
# plus manual dispatch.
on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/task-manager-app/package-lock.json

      # docker compose v2 is preinstalled on ubuntu-latest. The override file is
      # applied automatically and flips services to Development (relaxed rate limits,
      # 1-minute deadline scan) — exactly what the E2E flows need.
      - name: Start backend stack
        run: docker compose up -d --build

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "Gateway healthy after $((i*5))s"; exit 0
            fi
            echo "waiting for gateway health ($i/60)..."; sleep 5
          done
          echo "::error::Gateway did not become healthy in time"
          docker compose ps
          docker compose logs --no-color --tail 200
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend/task-manager-app
        run: npm ci

      # E2E targets the dev server: only environment.ts points apiUrl at the
      # gateway (localhost:5000); the prod/staging builds point at example.com.
      - name: Start Angular dev server
        working-directory: frontend/task-manager-app
        run: |
          nohup npm start > "$RUNNER_TEMP/ng-serve.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4200 >/dev/null 2>&1; then
              echo "Angular dev server up after $((i*5))s"; exit 0
            fi
            echo "waiting for ng serve ($i/60)..."; sleep 5
          done
          echo "::error::Angular dev server did not come up in time"
          cat "$RUNNER_TEMP/ng-serve.log" || true
          exit 1

      # Build first so the generated playwright CLI exists, then install Chromium
      # WITH its OS dependencies (the in-fixture `install chromium` skips --with-deps).
      - name: Build E2E project
        run: dotnet build tests/TaskManager.E2E.Tests --configuration Release

      - name: Install Playwright Chromium + OS deps
        run: pwsh tests/TaskManager.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # E2E_* env vars default to the localhost ports the compose stack publishes
      # (gateway 5000, frontend 4200, mailhog 8025, seq 5341) — no overrides needed.
      - name: Run Playwright E2E
        run: dotnet test tests/TaskManager.E2E.Tests --configuration Release --no-build

      - name: Dump stack logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
          cat "$RUNNER_TEMP/ng-serve.log" || true
