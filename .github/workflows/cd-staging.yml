name: CD Staging

on:
  push:
    branches: [develop]

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/smart-task-manager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { name: gateway,       dockerfile: src/gateway/TaskManager.Gateway/Dockerfile }
          - { name: identity,      dockerfile: src/services/identity/TaskManager.Identity/Dockerfile }
          - { name: tasks,         dockerfile: src/services/tasks/TaskManager.Tasks/Dockerfile }
          - { name: notifications, dockerfile: src/services/notifications/TaskManager.Notifications/Dockerfile }
          - { name: analytics,     dockerfile: src/services/analytics/TaskManager.Analytics/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:develop
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: hashFiles('frontend/task-manager-app/package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/task-manager-app/package-lock.json
      - run: cd frontend/task-manager-app && npm ci && npm run build -- --configuration staging
      - uses: vercel/action@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: frontend/task-manager-app/dist/task-manager-app
          # no --prod flag → Vercel staging preview URL

  deploy-staging-backend:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.FLY_DEPLOY_ENABLED == 'true'
    strategy:
      matrix:
        app:
          - smart-task-manager-gateway-staging
          - smart-task-manager-identity-staging
          - smart-task-manager-tasks-staging
          - smart-task-manager-notifications-staging
          - smart-task-manager-analytics-staging
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app ${{ matrix.app }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
