name: CD Production

# Triggers on the release tag, not on push to main. The Gitflow release process
# (spec §10) merges release/* into main and THEN pushes `vX.Y.Z` — triggering on
# main-push fired before the tag existed, so images were stamped v0.0.0 and a deploy
# ran for every main commit. Tag-triggering stamps the real version and ties each
# production deploy to an explicit, SemVer-tagged release (hotfixes tag too).
on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/smart-task-manager

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        # On a tag push, ref_name is the tag itself (e.g. v1.0.0).
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  build-and-push:
    runs-on: ubuntu-latest
    needs: get-version
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { name: gateway,       dockerfile: src/gateway/TaskManager.Gateway/Dockerfile }
          - { name: identity,      dockerfile: src/services/identity/TaskManager.Identity/Dockerfile }
          - { name: tasks,         dockerfile: src/services/tasks/TaskManager.Tasks/Dockerfile }
          - { name: notifications, dockerfile: src/services/notifications/TaskManager.Notifications/Dockerfile }
          - { name: analytics,     dockerfile: src/services/analytics/TaskManager.Analytics/Dockerfile }
    steps:
      - uses: actions/checkout@v6
      # GHCR rejects mixed-case repository names; the owner (github.repository_owner)
      # can contain capitals, so lowercase it here. Workflow-expression context has no
      # lowercase function — do it in bash and override IMAGE_PREFIX for later steps.
      - name: Lowercase image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smart-task-manager" >> "$GITHUB_ENV"
      # The gha cache backend (cache-to: type=gha) needs the buildx container
      # driver; the default docker driver can't export a cache and the build fails.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ needs.get-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production-frontend:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Skipped until the Vercel secrets are wired up — mirrors the FLY_DEPLOY_ENABLED
    # gate on the backend job so CD stays green instead of failing on empty secrets.
    if: vars.VERCEL_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v6
      # hashFiles() is not available in job-level `if` — gate on a step output instead.
      - name: Check frontend exists
        id: frontend
        run: echo "exists=$([ -f frontend/task-manager-app/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.frontend.outputs.exists == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/task-manager-app/package-lock.json
      - if: steps.frontend.outputs.exists == 'true'
        run: cd frontend/task-manager-app && npm ci && npm run build -- --configuration production
      - uses: vercel/action@v1
        if: steps.frontend.outputs.exists == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: frontend/task-manager-app/dist/task-manager-app
          vercel-args: '--prod'

  deploy-production-backend:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.FLY_DEPLOY_ENABLED == 'true'
    strategy:
      matrix:
        app:
          - smart-task-manager-gateway
          - smart-task-manager-identity
          - smart-task-manager-tasks
          - smart-task-manager-notifications
          - smart-task-manager-analytics
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app ${{ matrix.app }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
