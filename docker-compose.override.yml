# Local dev overrides — applied automatically by docker compose.
# Use `docker compose up` to get this merged with docker-compose.yml.

services:
  gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  identity-svc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  tasks-svc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  notifications-svc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  analytics-svc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  # Angular dev server — only useful once frontend/task-manager-app exists (Step 2b).
