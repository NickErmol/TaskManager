# Local dev overrides — applied automatically by docker compose.
# Use `docker compose up` to get this merged with docker-compose.yml.
#
# Note: running the containers in Development makes appsettings.Development.json
# win, and that file targets localhost (for `dotnet run`). The Serilog__* and
# ReverseProxy__* env vars below re-point those values at the compose network
# (env beats JSON).

services:
  gateway:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
      ReverseProxy__Clusters__identity-cluster__Destinations__default__Address: http://identity-svc:8080
      ReverseProxy__Clusters__tasks-cluster__Destinations__default__Address: http://tasks-svc:8080
      ReverseProxy__Clusters__notifications-cluster__Destinations__default__Address: http://notifications-svc:8080
      ReverseProxy__Clusters__analytics-cluster__Destinations__default__Address: http://analytics-svc:8080
      # E2E runs register many users from one IP — spec limits (100/10 per min)
      # would starve the suite. Production keeps the defaults from Program.cs.
      RateLimiting__GlobalPermitLimit: "2000"
      RateLimiting__AuthPermitLimit: "500"

  identity-svc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
      # v1.3 OAuth (spec §13.6): dev-only fake provider so E2E exercises the
      # full external-login flow. Browser-facing leg via the gateway; token /
      # userinfo legs loop back to this container.
      OAUTH_FAKE_ENABLED: "true"
      FakeOAuth__PublicUrl: http://localhost:5000
      FakeOAuth__SelfUrl: http://localhost:8080
      FRONTEND_URL: http://localhost:4200

  tasks-svc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
      # Local/E2E: scan for approaching deadlines every minute instead of hourly
      # so the deadline-email flow is testable. Production keeps the 60-min default.
      Deadline__ScanIntervalMinutes: "1"

  notifications-svc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341

  analytics-svc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Serilog__WriteTo__1__Args__serverUrl: http://seq:5341

  # Angular dev server — only useful once frontend/task-manager-app exists (Step 2b).
  # Uncomment when you start working on the SPA. Until then the service builds but isn't started.
  # angular-dev:
  #   image: node:22-alpine
  #   container_name: tm-angular-dev
  #   working_dir: /app
  #   command: sh -c "npm ci && npm run start -- --host 0.0.0.0 --poll 1000"
  #   ports:
  #     - "4200:4200"
  #   volumes:
  #     - ./frontend/task-manager-app:/app
  #     - /app/node_modules
